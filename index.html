<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выбери своего героя</title>
<style>
  
 <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Новая цветовая схема: Графит + Оранжевый + Белый */
    --bg: #121212;
    --surface: #1c1c1e;
    --surface-hover: #2c2c2e;
    --accent: #ff4b14; /* Оранжевый со скрина, чуть более насыщенный */
    --accent-glow: rgba(255, 75, 20, 0.3);
    --text: #ffffff;
    --muted: #8e8e93;
    --border: #333336;
    
    /* Шрифт: Barlow (аналог DIN), затем DIN PT, затем системный */
    --font-main: 'Barlow', 'DIN PT', 'DIN Alternate', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background: radial-gradient(circle at 50% 0%, #2a2a2e 0%, var(--bg) 60%);
    color:var(--text);
    font-family: var(--font-main);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .app{width:100%;max-width:960px}

  /* ЭКРАН ВЫБОРА */
  #selectView h1{font-size:clamp(24px,5vw,36px);text-align:center;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
  #selectView h1 span{color: var(--accent); text-shadow: 0 0 20px var(--accent-glow);}
  .sub{text-align:center;color:var(--muted);margin:10px auto 32px;font-size:16px;max-width:460px;font-weight:400}
  
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:420px){.grid{grid-template-columns:1fr}}

  .hero-tile{
    background:var(--surface);
    border:1.5px solid var(--border);border-radius:16px;
    padding:24px 16px;cursor:pointer;text-align:center;color:inherit;font-family:inherit;
    transition:.25s ease;
  }
  .hero-tile:hover{
    border-color:var(--accent);transform:translateY(-4px);
    background: var(--surface-hover);
    box-shadow:0 10px 30px -10px var(--accent-glow);
  }
  .hero-tile .emoji{
    font-size:44px;display:block;margin-bottom:12px;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  .hero-tile h3{font-size:16px;font-weight:600;margin-bottom:6px;letter-spacing:.5px}
  .hero-tile p{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:500}

  /* ЭКРАН РЕЗУЛЬТАТА (КАРТОЧКА) */
  .result{display:none;flex-direction:column;align-items:center;gap:24px}
  .result.show{display:flex}

  .hero-card{
    width:360px;max-width:100%;
    background: linear-gradient(180deg, var(--surface) 0%, #0a0a0c 100%);
    border-radius:20px;padding:30px 24px 24px;
    border:1px solid var(--border);
    box-shadow: 0 20px 50px -10px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05) inset;
    position:relative;overflow:hidden;
  }
  .result.show .hero-card{animation:cardIn .6s cubic-bezier(.2,1.2,.4,1)}
  
  /* Оранжевое свечение сверху */
  .hero-card::before{
    content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);
    width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    pointer-events:none;
  }
  
  .rank-badge{
    position:absolute;top:20px;right:20px;z-index:2;
    background:var(--bg);
    border:1px solid var(--border);border-radius:8px;
    padding:6px 12px;color:var(--accent);
    font-weight:800;font-size:20px;line-height:1;
    box-shadow: 0 0 20px var(--accent-glow);
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .rank-badge small{font-size:9px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

  .portrait{
    width:120px;height:120px;margin:10px auto 20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:64px;
    background:var(--bg);
    border:2px solid var(--accent);
    box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(255,75,20,0.1);
    position:relative;z-index:1;
  }
  .hero-name{text-align:center;font-size:24px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;position:relative;z-index:1}
  .hero-role{
    text-align:center;color:var(--accent);font-size:13px;margin-top:6px;margin-bottom:24px;
    text-transform:uppercase;letter-spacing:2px;font-weight:600;position:relative;z-index:1;
  }
  
  /* Характеристики */
  .stats{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;position:relative;z-index:1}
  .stat{display:grid;grid-template-columns:70px 1fr 24px;align-items:center;gap:12px;font-size:12px;font-weight:500}
  .stat-label{color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .stat-val{text-align:right;font-weight:800;color:var(--text)}
  .bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
  .bar-fill{
    height:100%;border-radius:3px;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent-glow);
    animation:grow .8s cubic-bezier(.2,1,.4,1) backwards;
  }
  
  .hero-desc{
    font-size:14px;color:var(--muted);line-height:1.6;text-align:center;
    padding:18px 6px 0;border-top:1px solid var(--border);position:relative;z-index:1;
  }
  
  .card-footer{
    text-align:center;color:var(--accent);font-size:10px;margin-top:16px;
    letter-spacing:2px;text-transform:uppercase;font-weight:600;position:relative;z-index:1;
  }

  /* Кнопки */
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{padding:14px 28px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;text-transform:uppercase;letter-spacing:1px}
  .btn-ghost{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,75,20,0.05)}

  .screenshot-tip{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--border);
    padding:12px 20px;border-radius:12px;font-size:13px;color:var(--muted);max-width:360px;font-weight:500;
  }
  .screenshot-tip .icon{font-size:20px;color:var(--accent)}

  @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
  @keyframes grow{from{width:0}}
</style>
</head>
<body>
<div class="app">
  <div id="selectView">
    <h1>Выбери своего <span>героя</span></h1>
    <p class="sub">У каждого свой характер, стиль и ранг. Выбери своего бойца для помощи Лаки!</p>
    <div class="grid" id="grid"></div>
  </div>

  <div class="result" id="resultView">
    <div class="hero-card" id="heroCard">
      <div class="rank-badge" id="rankBadge"></div>
      <div class="portrait" id="portrait"></div>
      <div class="hero-name" id="heroName"></div>
      <div class="hero-role" id="heroRole"></div>
      <div class="stats" id="stats"></div>
      <div class="hero-desc" id="heroDesc"></div>
      <div class="card-footer" id="cardFooter"></div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="againBtn">← Выбрать другого</button>
    </div>
    <div class="screenshot-tip">
      <span class="icon">📸</span>
      <span>Сделай скриншот карточки и покажи в комментариях ;)</span>
    </div>
  </div>
</div>

<script>
const rankStyles = {
  'SS': {grad1:'#fbbf24', grad2:'#f59e0b'},
  'S':  {grad1:'#a78bfa', grad2:'#7c5cff'},
  'A':  {grad1:'#22d3ee', grad2:'#06b6d4'},
};

const heroes = [
  { id:'bard', emoji:'🧝', name:'Эльф-бард', archetype:'Человек-оркестр',
    rank:'S', rankLabel:'эпический', c1:'#a855f7', c2:'#d8b4fe',
    desc:'Делаю всё сразу: играю, говорю, веду. Многозадачность - моя стихия.',
    stats:{'Сила':5,'Ум':10,'Харизма':9,'Скорость':6} },

  { id:'rogue', emoji:'🗡️', name:'Полурослик-плут', archetype:'Мастер дедлайнов',
    rank:'A', rankLabel:'редкий', c1:'#10b981', c2:'#6ee7b7',
    desc:'Включаюсь в последний момент и вытаскиваю проект. Адреналин - моё топливо.',
    stats:{'Сила':4,'Ум':10,'Харизма':5,'Скорость':10} },

  { id:'seer', emoji:'🧙', name:'Дроу-провидец', archetype:'Наблюдатель',
    rank:'SS', rankLabel:'легендарный', c1:'#6366f1', c2:'#a5b4fc',
    desc:'Молчу, смотрю, знаю. Замечаю то, что пропускают другие.',
    stats:{'Сила':4,'Ум':10,'Харизма':7,'Скорость':5} },

  { id:'tinker', emoji:'⚙️', name:'Гном-изобретатель', archetype:'Генератор идей',
    rank:'S', rankLabel:'эпический', c1:'#f59e0b', c2:'#fcd34d',
    desc:'Идей больше, чем времени. Создам из ничего что угодно.',
    stats:{'Сила':6,'Ум':10,'Харизма':5,'Скорость':6} },

  { id:'warrior', emoji:'⚔️', name:'Человек-воин', archetype:'Исполнитель',
    rank:'A', rankLabel:'редкий', c1:'#ef4444', c2:'#fca5a5',
    desc:'Сказано - сделано. На мне держится любой проект и любая команда.',
    stats:{'Сила':9,'Ум':10,'Харизма':4,'Скорость':7} },

  { id:'diplomat', emoji:'🌙', name:'Тифлинг-дипломат', archetype:'Переговорщик',
    rank:'SS', rankLabel:'легендарный', c1:'#ec4899', c2:'#f9a8d4',
    desc:'Договорюсь с кем угодно. Решаю конфликты до того, как они начнутся.',
    stats:{'Сила':3,'Ум':10,'Харизма':10,'Скорость':5} },
];

const hexToRgba = (hex, a) => {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
};

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  heroes.forEach(h => {
    const tile = document.createElement('button');
    tile.className = 'hero-tile';
    tile.innerHTML = `<span class="emoji">${h.emoji}</span><h3>${h.name}</h3><p>${h.archetype}</p>`;
    tile.onclick = () => selectHero(h);
    grid.appendChild(tile);
  });
}

function selectHero(hero) {
  document.getElementById('selectView').style.display = 'none';
  document.getElementById('resultView').classList.add('show');

  const card = document.getElementById('heroCard');
  
  // Если ранг SS - делаем бейдж золотым, если S - оранжевым, если A - зеленым
  let rankColor = 'var(--muted)';
  if(hero.rank === 'SS') rankColor = '#ffd700';
  if(hero.rank === 'S') rankColor = 'var(--accent)';
  
  const badge = document.getElementById('rankBadge');
  badge.innerHTML = `${hero.rank}<small>${hero.rankLabel}</small>`;
  badge.style.color = rankColor;
  badge.style.boxShadow = `0 0 20px ${rankColor === '#ffd700' ? 'rgba(255,215,0,0.3)' : 'var(--accent-glow)'}`;

  document.getElementById('portrait').textContent = hero.emoji;
  document.getElementById('heroName').textContent = hero.name;
  document.getElementById('heroRole').textContent = hero.archetype;
  document.getElementById('heroDesc').textContent = hero.desc;

  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = '';
  Object.entries(hero.stats).forEach(([label, value], i) => {
    const row = document.createElement('div');
    row.className = 'stat';
    row.innerHTML = `
      <span class="stat-label">${label}</span>
      <div class="bar"><div class="bar-fill" style="width:${value*10}%;animation-delay:${i*0.1}s"></div></div>
      <span class="stat-val">${value}</span>`;
    statsEl.appendChild(row);
  });

  const stars = {'SS':5,'S':4,'A':3}[hero.rank] || 0;
  document.getElementById('cardFooter').textContent =
    ('★ '.repeat(stars)).trim() + ' · МОЙ СОЮЗНИК · 2026';
}

document.getElementById('againBtn').onclick = () => {
  document.getElementById('resultView').classList.remove('show');
  document.getElementById('selectView').style.display = 'block';
};

renderGrid();
</script>
</body>
</html>
