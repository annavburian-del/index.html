<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выбери своего героя</title>
<style>
  :root{ --text:#eef0ff; --muted:#8a8fb8; --accent:#7c5cff; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 50% 0%, #1a1a3a 0%, #07070f 70%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .app{width:100%;max-width:960px}

  /* ВЫБОР */
  #selectView h1{font-size:clamp(22px,4vw,32px);text-align:center;font-weight:700;letter-spacing:-.02em}
  #selectView h1 span{
    background:linear-gradient(90deg,#7c5cff,#00e0c6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{text-align:center;color:var(--muted);margin:10px auto 32px;font-size:15px;max-width:440px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:420px){.grid{grid-template-columns:1fr}}

  .hero-tile{
    background:linear-gradient(160deg,#141428,#0e0e1e);
    border:1.5px solid #262650;border-radius:18px;
    padding:20px 14px;cursor:pointer;text-align:center;color:inherit;font:inherit;
    transition:.25s cubic-bezier(.4,0,.2,1);
  }
  .hero-tile:hover{
    border-color:#4a4a8a;transform:translateY(-4px);
    box-shadow:0 14px 30px -10px rgba(124,92,255,.4);
  }
  .hero-tile .emoji{
    font-size:42px;display:block;margin-bottom:10px;
    filter:drop-shadow(0 4px 12px rgba(124,92,255,.4));
  }
  .hero-tile h3{font-size:15px;margin-bottom:4px}
  .hero-tile p{font-size:12.5px;color:var(--muted)}

  /* КАРТОЧКА */
  .result{display:none;flex-direction:column;align-items:center;gap:20px}
  .result.show{display:flex}

  .hero-card{
    width:340px;max-width:100%;
    background:linear-gradient(180deg,var(--c1a) 0%, #0d0d1c 55%, #0a0a16 100%);
    border-radius:24px;padding:26px 22px 20px;
    border:1px solid var(--c1b);
    box-shadow:0 30px 60px -20px var(--c1a), 0 0 0 1px rgba(255,255,255,.05) inset;
    position:relative;overflow:hidden;
  }
  .result.show .hero-card{animation:cardIn .6s cubic-bezier(.2,1.2,.4,1)}
  .hero-card::before{
    content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);
    width:240px;height:240px;border-radius:50%;
    background:radial-gradient(circle,var(--c1a) 0%, transparent 70%);
    pointer-events:none;
  }
  .rank-badge{
    position:absolute;top:16px;right:16px;z-index:2;
    background:linear-gradient(135deg,var(--rank1),var(--rank2));
    border-radius:12px;padding:6px 12px;
    font-weight:800;font-size:18px;line-height:1;color:#000;
    box-shadow:0 4px 20px -4px var(--rank1), inset 0 1px 0 rgba(255,255,255,.5);
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .rank-badge small{font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.75}

  .portrait{
    width:110px;height:110px;margin:8px auto 14px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:58px;
    background:radial-gradient(circle,var(--c1a) 0%, transparent 70%);
    border:2px solid var(--c1b);
    box-shadow:0 0 40px -8px var(--c1a), inset 0 0 20px rgba(255,255,255,.08);
    position:relative;z-index:1;
    filter:drop-shadow(0 6px 16px var(--c1a));
  }
  .hero-name{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.01em;position:relative;z-index:1}
  .hero-role{
    text-align:center;color:var(--c2);font-size:13px;margin-top:4px;margin-bottom:20px;
    text-transform:uppercase;letter-spacing:1px;font-weight:600;position:relative;z-index:1;
  }
  .stats{display:flex;flex-direction:column;gap:9px;margin-bottom:18px;position:relative;z-index:1}
  .stat{display:grid;grid-template-columns:64px 1fr 24px;align-items:center;gap:8px;font-size:12px}
  .stat-label{color:var(--muted)}
  .stat-val{text-align:right;font-weight:700;color:var(--c2)}
  .bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
  .bar-fill{
    height:100%;border-radius:3px;
    background:linear-gradient(90deg,var(--c1),var(--c2));
    box-shadow:0 0 10px -2px var(--c2);
    animation:grow .8s cubic-bezier(.2,1,.4,1) backwards;
  }
  .hero-desc{
    font-size:13px;color:var(--muted);line-height:1.55;text-align:center;
    padding:14px 4px 0;border-top:1px solid rgba(255,255,255,.08);position:relative;z-index:1;
  }
  .hero-desc::before{content:'«';color:var(--c2);font-size:20px;line-height:0;vertical-align:-6px;margin-right:2px}
  .hero-desc::after{content:'»';color:var(--c2);font-size:20px;line-height:0;vertical-align:-6px;margin-left:2px}
  .card-footer{
    text-align:center;color:#4a4a70;font-size:10px;margin-top:14px;
    letter-spacing:2px;text-transform:uppercase;position:relative;z-index:1;
  }

  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{padding:13px 24px;border-radius:14px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
  .btn-ghost{background:transparent;color:var(--text);border:1.5px solid #3a3a70}
  .btn-ghost:hover{border-color:var(--accent);background:rgba(124,92,255,.1)}

  .screenshot-tip{
    display:flex;align-items:center;gap:10px;
    background:rgba(124,92,255,.1);border:1px solid rgba(124,92,255,.3);
    padding:10px 18px;border-radius:12px;font-size:13px;color:var(--muted);max-width:340px;
  }
  .screenshot-tip .icon{font-size:18px}

  @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes grow{from{width:0}}
</style>
</head>
<body>
<div class="app">
  <div id="selectView">
    <h1>Выбери своего <span>героя</span></h1>
    <p class="sub">У каждого свой характер, стиль и ранг. Выбери своего бойца для помощи Лаки!</p>
    <div class="grid" id="grid"></div>
  </div>

  <div class="result" id="resultView">
    <div class="hero-card" id="heroCard">
      <div class="rank-badge" id="rankBadge"></div>
      <div class="portrait" id="portrait"></div>
      <div class="hero-name" id="heroName"></div>
      <div class="hero-role" id="heroRole"></div>
      <div class="stats" id="stats"></div>
      <div class="hero-desc" id="heroDesc"></div>
      <div class="card-footer" id="cardFooter"></div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="againBtn">← Выбрать другого</button>
    </div>
    <div class="screenshot-tip">
      <span class="icon">📸</span>
      <span>Сделай скриншот карточки и покажи в комментариях ;)</span>
    </div>
  </div>
</div>

<script>
const rankStyles = {
  'SS': {grad1:'#fbbf24', grad2:'#f59e0b'},
  'S':  {grad1:'#a78bfa', grad2:'#7c5cff'},
  'A':  {grad1:'#22d3ee', grad2:'#06b6d4'},
};

const heroes = [
  { id:'bard', emoji:'🧝', name:'Эльф-бард', archetype:'Человек-оркестр',
    rank:'S', rankLabel:'эпический', c1:'#a855f7', c2:'#d8b4fe',
    desc:'Делаю всё сразу: играю, говорю, веду. Многозадачность - моя стихия.',
    stats:{'Сила':5,'Ум':10,'Харизма':9,'Скорость':6} },

  { id:'rogue', emoji:'🗡️', name:'Полурослик-плут', archetype:'Мастер дедлайнов',
    rank:'A', rankLabel:'редкий', c1:'#10b981', c2:'#6ee7b7',
    desc:'Включаюсь в последний момент и вытаскиваю проект. Адреналин - моё топливо.',
    stats:{'Сила':4,'Ум':10,'Харизма':5,'Скорость':10} },

  { id:'seer', emoji:'🧙', name:'Дроу-провидец', archetype:'Наблюдатель',
    rank:'SS', rankLabel:'легендарный', c1:'#6366f1', c2:'#a5b4fc',
    desc:'Молчу, смотрю, знаю. Замечаю то, что пропускают другие.',
    stats:{'Сила':4,'Ум':10,'Харизма':7,'Скорость':5} },

  { id:'tinker', emoji:'⚙️', name:'Гном-изобретатель', archetype:'Генератор идей',
    rank:'S', rankLabel:'эпический', c1:'#f59e0b', c2:'#fcd34d',
    desc:'Идей больше, чем времени. Создам из ничего что угодно.',
    stats:{'Сила':6,'Ум':10,'Харизма':5,'Скорость':6} },

  { id:'warrior', emoji:'⚔️', name:'Человек-воин', archetype:'Исполнитель',
    rank:'A', rankLabel:'редкий', c1:'#ef4444', c2:'#fca5a5',
    desc:'Сказано - сделано. На мне держится любой проект и любая команда.',
    stats:{'Сила':9,'Ум':10,'Харизма':4,'Скорость':7} },

  { id:'diplomat', emoji:'🌙', name:'Тифлинг-дипломат', archetype:'Переговорщик',
    rank:'SS', rankLabel:'легендарный', c1:'#ec4899', c2:'#f9a8d4',
    desc:'Договорюсь с кем угодно. Решаю конфликты до того, как они начнутся.',
    stats:{'Сила':3,'Ум':10,'Харизма':10,'Скорость':5} },
];

const hexToRgba = (hex, a) => {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
};

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  heroes.forEach(h => {
    const tile = document.createElement('button');
    tile.className = 'hero-tile';
    tile.innerHTML = `<span class="emoji">${h.emoji}</span><h3>${h.name}</h3><p>${h.archetype}</p>`;
    tile.onclick = () => selectHero(h);
    grid.appendChild(tile);
  });
}

function selectHero(hero) {
  // сначала показываем экран — чтобы анимации элементов сыграли «с нуля»
  document.getElementById('selectView').style.display = 'none';
  document.getElementById('resultView').classList.add('show');

  const card = document.getElementById('heroCard');
  card.style.setProperty('--c1',  hero.c1);
  card.style.setProperty('--c2',  hero.c2);
  card.style.setProperty('--c1a', hexToRgba(hero.c1, 0.5));
  card.style.setProperty('--c1b', hexToRgba(hero.c1, 0.4));

  const rs = rankStyles[hero.rank];
  card.style.setProperty('--rank1', rs.grad1);
  card.style.setProperty('--rank2', rs.grad2);

  document.getElementById('rankBadge').innerHTML = `${hero.rank}<small>${hero.rankLabel}</small>`;
  document.getElementById('portrait').textContent = hero.emoji;
  document.getElementById('heroName').textContent = hero.name;
  document.getElementById('heroRole').textContent = hero.archetype;
  document.getElementById('heroDesc').textContent = hero.desc;

  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = '';
  Object.entries(hero.stats).forEach(([label, value], i) => {
    const row = document.createElement('div');
    row.className = 'stat';
    row.innerHTML = `
      <span class="stat-label">${label}</span>
      <div class="bar"><div class="bar-fill" style="width:${value*10}%;animation-delay:${i*0.1}s"></div></div>
      <span class="stat-val">${value}</span>`;
    statsEl.appendChild(row);
  });

  const stars = {'SS':5,'S':4,'A':3}[hero.rank] || 0;
  document.getElementById('cardFooter').textContent =
    ('★ '.repeat(stars)).trim() + ' · Мой союзник · 2026';
}

document.getElementById('againBtn').onclick = () => {
  document.getElementById('resultView').classList.remove('show');
  document.getElementById('selectView').style.display = 'block';
};

renderGrid();
</script>
</body>
</html>
